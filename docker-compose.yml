services:
  myphotox:
    image: ghcr.io/quanq026/myphotox:latest
    container_name: myphotox
    restart: unless-stopped
    ports:
      - "${MYPHOTOX_PORT:-2342}:2342"
    environment:
      PHOTOPRISM_ADMIN_USER: "${PHOTOPRISM_ADMIN_USER:-admin}"
      PHOTOPRISM_ADMIN_PASSWORD: "${PHOTOPRISM_ADMIN_PASSWORD:-photoprism}"
      PHOTOPRISM_SITE_URL: "${PHOTOPRISM_SITE_URL:-http://localhost:2342/}"
      PHOTOPRISM_SITE_TITLE: "${PHOTOPRISM_SITE_TITLE:-MyPhotoX}"
      PHOTOPRISM_SITE_CAPTION: "${PHOTOPRISM_SITE_CAPTION:-Self-Hosted Photos App}"
      PHOTOPRISM_APP_NAME: "${PHOTOPRISM_APP_NAME:-MyPhotoX}"
      PHOTOPRISM_DEFAULT_LOCALE: "${PHOTOPRISM_DEFAULT_LOCALE:-en}"
      PHOTOPRISM_AUTH_MODE: "password"
      PHOTOPRISM_DEBUG: "false"
    volumes:
      - "./originals:/myphotox/originals"
      - "./import:/myphotox/import"
      - "./storage:/myphotox/storage"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2342/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
