name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-update-notifier

      - name: Security XSS scan
        run: npm --workspace=frontend run security:scan-xss

      - name: Build & precompress assets
        run: |
          npm --workspace=frontend run build
          node frontend/scripts/precompress.js
          ls -la assets/static/build

  ci-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install CGo media libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev libheif-dev pkg-config

      - name: Verify Go modules
        run: go mod verify

      - name: Vet & build binary
        env:
          CGO_ENABLED: '1'
        run: |
          go vet ./cmd/photoprism/... ./internal/ai/... ./internal/service/hub/... ./internal/config/...
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o /tmp/myphotox ./cmd/photoprism/photoprism.go
          ! ldd /tmp/myphotox | grep -qi tensorflow

  cd-docker:
    name: Docker CD (GHCR)
    needs:
      - ci-frontend
      - ci-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
